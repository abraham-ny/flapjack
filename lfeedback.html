    <div class="background">
        <form id="feedbackForm" class="mx-auto">
            <div class="window glass active" style="--w7-w-bg: #805ba5;">
                <div class="title-bar">
                    <div class="title-bar-text">Feedback</div>
                    <div class="title-bar-controls">
                        <button aria-label="Help" aria-describedby="balloon-password"></button>
                        <button aria-label="Minimize" aria-describedby="balloon-password"></button>
                        <button aria-label="Maximize" disabled aria-describedby="balloon-password"></button>
                        <button aria-label="Close" aria-describedby="balloon-password"></button>
                        <div role="tooltip" id="balloon-password" hidden>not available currently | v0.0.1</div>
                    </div>
                </div>
                <div class="window-body has-space">
                    <select id="ufeedtype" name="type" aria-label="Feedback Type" style="width: 100%; margin-bottom: 1em;">
                        <option selected>Feedback</option>
                        <option>Bug Report</option>
                        <option>Feature Request</option>
                        <option>Message</option>
                        <option>Other</option>
                    </select>
                    <input type="hidden" id="srchidden" name="source" value="PortfolioVintage Website">
                    <div class="group" style="width: 100%; margin-bottom: 1em;">
                        <label for="uname">User Name or Email (optional)</label>
                        <input id="uname" name="email" type="name|email">
                    </div>
                    <div class="group" style="width: 100%; margin-bottom: 1em;">
                        <label for="ucontact">Other ways to get back to you (optional)</label>
                        <input id="ucontact" name="name" type="text">
                    </div>
                    <div class="group" style="width: 100%; margin-bottom: 1em;">
                        <label for="umsg">Feedback</label>
                        <textarea id="umsg" name="feedback" rows="8" maxlength="5000" placeholder="psst* You can drag this window"
                            style="resize: none;"></textarea>
                        <div id="umsg-remaining" style="font-size: 0.9em; color: #555; text-align: right;">5000
                            characters remaining
                        </div>
                    </div>
                    <p id="formMessage">Thank you for using my services/products, feel free and be honest with your feedback.</p>
                </div>
                <footer style="text-align: right">
                    <button onclick="location.href='index-new.html'">Cancel</button>
                    <button type="submit" >Submit</button>
                </footer>
            </div>
        </form>
    </div>

        <div class="menu-sep" role="separator"></div>
        <div class="menu-item" data-action="legacy" role="menuitem">Open Legacy Interface</div>
    </div>

    <script>
        // new combined script: handle remaining count + URL params (source, reason, user, message)

        const textarea = document.getElementById('umsg');
        const remaining = document.getElementById('umsg-remaining');
        const maxLen = Number(textarea.maxLength) || 5000;

        function updateRemaining() {
            const left = Math.max(0, maxLen - textarea.value.length);
            remaining.textContent = left + ' characters remaining';
        }

        // attach listeners
        textarea.addEventListener('input', updateRemaining);
        textarea.addEventListener('paste', function () {
            // wait for paste to complete
            setTimeout(updateRemaining, 0);
        });

        // parse URL params and apply them if present
        (function applyUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const source = params.get('source') || '';
            const reason = params.get('reason');
            const user = params.get('user') || '';
            const message = params.get('message') || '';

            // set title bar text if source provided
            const srchidden = document.getElementById('srchidden');
            const titleEl = document.querySelector('.title-bar-text');
            if (source) {
                srchidden.value = source;
                titleEl.textContent = `${source} - Feedback`;
                console.log(`Set source to: ${srchidden.value}`);
            }

            // set user name/email if provided
            const uname = document.getElementById('uname');
            if (user) {
                try { uname.value = user; } catch (e) { /* ignore */ }
            }

            // set select option based on reason (case-insensitive match against option text)
            const select = document.getElementById('ufeedtype');
            if (reason) {
                const reasonNorm = reason.trim().toLowerCase();
                let matched = false;

                for (let i = 0; i < select.options.length; i++) {
                    const opt = select.options[i];
                    const text = (opt.value || opt.text || '').toString().trim().toLowerCase();
                    if (text === reasonNorm) {
                        select.selectedIndex = i;
                        matched = true;
                        break;
                    }
                }

                // try partial match if no exact match
                if (!matched) {
                    for (let i = 0; i < select.options.length; i++) {
                        const opt = select.options[i];
                        const text = (opt.value || opt.text || '').toString().trim().toLowerCase();
                        if (reasonNorm && text.includes(reasonNorm)) {
                            select.selectedIndex = i;
                            matched = true;
                            break;
                        }
                    }
                }

                // If reason param was present and we matched something, prevent changing it
                if (matched) {
                    select.disabled = true;
                    select.setAttribute('aria-disabled', 'true');
                }
            }

            // set message/textarea content if provided (truncate to maxlength)
            if (message) {
                let msg = message;
                if (msg.length > maxLen) msg = msg.slice(0, maxLen);
                textarea.value = msg;
            }

            // final update of remaining count
            updateRemaining();
        })();

        // ensure initial remaining shown even with no params
        updateRemaining();
    </script>
